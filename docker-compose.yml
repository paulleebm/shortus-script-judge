# 판정 서버와 Tailscale을 한 스택으로 띄운다(DECISIONS 22·23·24).
# Portainer: Stacks → Add stack → Repository, Compose path는 docker-compose.yml, 환경 변수는 ANTHROPIC_API_KEY만 넣으면 된다.
# 명령으로 띄울 때: 이 폴더의 .env(저장소에 올라가지 않음)에 ANTHROPIC_API_KEY=… 를 두고 docker compose up -d --build
# 처음 한 번: tailscale 컨테이너 로그의 주소로 로그인하고, 그 컨테이너 콘솔에서 tailscale funnel --bg http://judge:8787
services:
  judge:
    build: .
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY를 넣으세요}
      JUDGE_HOST: 0.0.0.0
      # Funnel이 X-Forwarded-For에 접속한 사람의 IP를 덮어써 넣는다. IP별 시간당 제한이 그 값을 쓴다
      JUDGE_TRUST_PROXY: "1"
      JUDGE_EXTENSION_IDS: ${JUDGE_EXTENSION_IDS:-ncinhhanfchakpbicokcnpnmplnipond}
      JUDGE_DAILY_BUDGET_USD: ${JUDGE_DAILY_BUDGET_USD:-5}
      JUDGE_RATE_PER_HOUR: ${JUDGE_RATE_PER_HOUR:-10}
    volumes:
      - judge-runs:/app/runs
    # 포트를 열지 않는다. 같은 스택의 tailscale 컨테이너만 judge:8787로 닿고, 바깥에서는 Funnel 주소로만 들어온다

  tailscale:
    image: tailscale/tailscale:v1.104.7
    restart: unless-stopped
    depends_on:
      - judge
    environment:
      # 공개 주소는 https://<TS_HOSTNAME>.<tailnet 이름>.ts.net
      TS_HOSTNAME: ${TS_HOSTNAME:-shortus-judge}
      TS_STATE_DIR: /var/lib/tailscale
      # 로그인과 Funnel 설정을 볼륨에 남겨, 다시 켜도 다시 로그인하지 않는다
      TS_AUTH_ONCE: "true"
      # 컨테이너 콘솔의 tailscale 명령이 --socket 없이 닿게 CLI 기본 경로로 둔다
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-state:/var/lib/tailscale

volumes:
  judge-runs:
  tailscale-state:
